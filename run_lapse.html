<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منذر سونيي - Lapse Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body { 
    min-height: 100vh;
    background: #0a0c12;
    color: #e8edf5;
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* خلفية الصورة - واضحة جداً */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url('preview.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.92;
    z-index: 0;
    filter: brightness(0.75);
  }

  /* طبقة تعتيم خفيفة جداً */
  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 12, 18, 0.25);
    z-index: 0;
  }

  #wrap {
    padding: 20px 24px;
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* الهيدر مع اسم منذر سونيي */
  #header {
    text-align: center;
    margin-bottom: 18px;
    padding: 16px 20px 14px;
    background: rgba(18, 24, 34, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  #header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #b3d9ff 0%, #7aa9f0 50%, #4d7edb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.3px;
    margin-bottom: 2px;
    text-shadow: 0 2px 30px rgba(74, 144, 226, 0.2);
  }

  #header .sub {
    font-size: 13px;
    color: #6b7b8f;
    letter-spacing: 0.5px;
    -webkit-text-fill-color: #6b7b8f;
  }

  #header .sub span {
    color: #8aa3c9;
    font-weight: 500;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    padding: 10px 16px;
    background: rgba(18, 24, 34, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, "Courier New", monospace;
    background: rgba(17, 21, 27, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 14px 18px;
    min-height: calc(100vh - 200px);
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    box-shadow: inset 0 2px 16px rgba(0, 0, 0, 0.4);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    color: #c8ced8;
  }

  /* تنسيق شريط التمرير */
  #out::-webkit-scrollbar {
    width: 6px;
  }
  #out::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
  }
  #out::-webkit-scrollbar-thumb {
    background: rgba(74, 144, 226, 0.3);
    border-radius: 10px;
  }
  #out::-webkit-scrollbar-thumb:hover {
    background: rgba(74, 144, 226, 0.5);
  }

  .ok { color: #7fd0a0; }
  .bad { color: #f28b82; }
  .warn { color: #fdd663; }

  /* شعار صغير */
  .footer {
    position: fixed;
    bottom: 12px;
    right: 20px;
    z-index: 2;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.12);
    letter-spacing: 0.5px;
    font-weight: 300;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }

  /* تنسيق للهواتف */
  @media (max-width: 600px) {
    #wrap { padding: 12px 14px; }
    #header h1 { font-size: 22px; }
    #state { font-size: 18px; padding: 8px 12px; }
    #out { font-size: 11px; padding: 10px 12px; min-height: calc(100vh - 180px); max-height: calc(100vh - 180px); }
    body::before {
      opacity: 0.95;
    }
  }

  /* نقاط تحميل متحركة */
  .loader-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 8px;
  }
  .loader-dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4d7edb;
    animation: dot-bounce 1.4s infinite ease-in-out both;
  }
  .loader-dots span:nth-child(1) { animation-delay: -0.32s; background: #5f8ee8; }
  .loader-dots span:nth-child(2) { animation-delay: -0.16s; background: #4d7edb; }
  .loader-dots span:nth-child(3) { background: #3b6bc9; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="wrap">
  
  <!-- الهيدر مع اسم منذر سونيي -->
  <div id="header">
    <h1>🤖 منذر سونيي</h1>
    <div class="sub">
      <span>الذكاء الاصطناعي</span> &bull; صيانة الأجهزة الإلكترونية &bull; <span>Lapse Chain</span>
    </div>
  </div>

  <div id="state">
    ⏳ جارٍ تحميل سلسلة Lapse...
    <span class="loader-dots">
      <span></span><span></span><span></span>
    </span>
  </div>
  
  <div id="out"></div>
</div>

<!-- شعار صغير -->
<div class="footer">PS4 AI TOOL • Lapse</div>

<script type="module">
  import "./chain_lapse.js";
</script>
</body>
</html>
