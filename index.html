<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منذر سونيي لصيانة الأجهزة الإلكترونية بصرة عشار شارع الكويت 009647700672595</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<h1>هذا المتصفح يدعم جميع إصدارات بلايستيشن 4 من نظام 5.05 إلى نظام 13.52</h1>
<hr>
<br>
<div id="loader" aria-label="جارٍ التحميل"><span></span></div>
<h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">
    جارٍ تحميل GoldHEN v2.4b18.12 ... يرجى الانتظار
</h1>

<script>
(function () {
    "use strict";

    var msgs = document.getElementById("msgs");
    function setMessage(html) { if (msgs) msgs.innerHTML = html; }
    function onScriptError() {
        setMessage("تعذر العثور على المحتوى! امسح بيانات المتصفح وأعد تثبيت الملفات ...");
    }

    // ===== كشف PS4 =====
    var uaFull = navigator.userAgent || "";
    var match = uaFull.match(/PlayStation 4[ \/]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Unknown";
    var fwNum = isPS4 ? parseFloat(fwVersion) : NaN;

    console.log("[HOST] UA:", uaFull, "| FW:", fwVersion);

    if (!isPS4) {
        setMessage("هذا الهوست مخصص لجهاز PS4 بإصدارات 5.05 و 7.00 إلى 13.52");
        return;
    }
    if (isNaN(fwNum)) {
        setMessage('تعذر تحديد إصدار النظام: <span style="color: red;">' + fwVersion + '</span>');
        return;
    }

    // ===== دالة تحميل السكربت مع دعم CORS =====
    function loadScript(src, opts) {
        opts = opts || {};
        var script = document.createElement("script");
        if (opts.module) script.type = "module";
        script.src = src;
        script.crossOrigin = "anonymous";
        script.onerror = onScriptError;
        if (opts.onload) script.onload = opts.onload;
        document.head.appendChild(script);
        console.log("[HOST] Loading:", src);
    }

    // ===== التوزيع حسب الإصدار =====
    if (fwNum === 5.05 || fwNum === 5.07) {
        loadScript("505/exploit.js");
    }
    else if (fwNum >= 7.00 && fwNum <= 8.52) {
        loadScript("700/alert.js", { module: true });
    }
    else if (fwNum >= 9.00 && fwNum <= 9.60) {
        loadScript("900/alert.js", { module: true });
    }
    else if (fwNum >= 10.00 && fwNum <= 11.02) {
        loadScript("css/main.js", {
            onload: function () {
                setTimeout(function () {
                    if (typeof window.doJb === "function") {
                        window.doJb();
                    } else {
                        setMessage("⚠️ دالة doJb غير موجودة!");
                    }
                }, 500);
            }
        });
    }
    else if (fwNum >= 11.50 && fwNum <= 12.02) {
        loadScript("slopkit/chain_lapse.js", { module: true });
    }
    else if (fwNum >= 12.50 && fwNum <= 13.00) {
        loadScript("slopkit/chain_poops.js", { module: true });
    }
    else if (fwNum >= 13.02 && fwNum <= 13.52) {
        loadScript("slopkit/jb.js?v=10", { module: true });
    }
    else {
        setMessage('إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>');
    }
})();
</script>

</body>
</html>
