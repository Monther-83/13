<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {

  min-height: 100vh;

  background: #05070c;

  color: #e8edf5;

  font:
    18px/1.6
    "Segoe UI",
    "Tahoma",
    system-ui,
    -apple-system,
    sans-serif;

  display: flex;

  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;
}


/* =====================================================
   BACKGROUND
   ===================================================== */

body::before {

  content: '';

  position: fixed;

  inset: 0;

  background-image: url('preview.png');

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  opacity: 0.88;

  z-index: 0;

  filter:
    brightness(0.62)
    contrast(1.08);
}


body::after {

  content: '';

  position: fixed;

  inset: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(30, 100, 255, 0.08),
      rgba(0, 0, 0, 0.58)
    );

  z-index: 0;

  pointer-events: none;
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

#container {

  width: 100%;

  max-width: 920px;

  padding:
    38px
    34px
    42px;

  margin: 20px;

  background:
    rgba(10, 15, 24, 0.80);

  backdrop-filter: blur(15px);

  -webkit-backdrop-filter: blur(15px);

  border-radius: 42px;

  border:
    1px solid
    rgba(100, 160, 255, 0.18);

  box-shadow:

    0 30px 70px
    rgba(0, 0, 0, 0.9),

    inset 0 1px 0
    rgba(255, 255, 255, 0.08),

    0 0 60px
    rgba(30, 100, 255, 0.08);

  text-align: center;

  position: relative;

  z-index: 1;
}


/* =====================================================
   HEADER
   ===================================================== */

#main-header {

  margin-bottom: 32px;

  padding-bottom: 22px;

  border-bottom:
    1px solid
    rgba(120, 170, 255, 0.15);
}


#main-header h1 {

  font-size: 50px;

  line-height: 1.2;

  font-weight: 850;

  color: #d9ecff;

  margin-bottom: 12px;

  letter-spacing: 0;

  text-shadow:

    0 0 5px
    rgba(150, 210, 255, 0.95),

    0 0 14px
    rgba(80, 160, 255, 0.95),

    0 0 30px
    rgba(50, 120, 255, 0.85),

    0 0 60px
    rgba(30, 90, 255, 0.55);

  animation:
    titleGlow
    2.8s
    ease-in-out
    infinite
    alternate;
}


@keyframes titleGlow {

  from {

    text-shadow:

      0 0 5px
      rgba(150, 210, 255, 0.75),

      0 0 14px
      rgba(80, 160, 255, 0.70),

      0 0 28px

  to {

    text-shadow:

      0 0 8px
      rgba(180, 225, 255, 1),

      0 0 20px
      rgba(90, 175, 255, 1),

      0 0 40px
      rgba(50, 125, 255, 0.90),

      0 0 70px
      rgba(30, 90, 255, 0.65);

  }

}


#main-header .sub {

  font-size: 19px;

  color: #9ebce0;

  letter-spacing: 0.8px;

  font-weight: 500;

  text-shadow:
    0 0 10px

#main-header .sub span {

/* =====================================================
   CARD
   ===================================================== */

.card {

}


/* =====================================================
   STATE
   ===================================================== */

#state {

  display: block;

  padding:

    20px;

    22px;

    rgba(255, 255, 255, 0.045);

  border:
    1px solid
    rgba(100, 160, 255, 0.13);

  font-size: 30px;

  line-height: 1.4;

  font-weight: 700;

  letter-spacing: -0.2px;

  text-shadow:

  box-shadow:

    0 0 25px

}


/* =====================================================
   DETAILS
   ===================================================== */

#det {

    10px;

  padding:

    18px;

  border-radius: 20px;

  background:
    rgba(255, 255, 255, 0.035);

  border:

    rgba(255, 255, 255, 0.06);

}

#det .chip {

  border-radius: 14px;

  color: #9bc8ff;

  font-size: 19px;

  font-weight: 700;

  margin:
    0
    5px;

  border:
    1px solid
    rgba(80, 150, 255, 0.18);

  box-shadow:

    0 0 12px
    rgba(60, 130, 255, 0.18);

  text-shadow:

    0 0 8px
    rgba(80, 160, 255, 0.65);
}


/* =====================================================
   CACHE
   ===================================================== */

#cache {

  font-size: 18px;

  color: #8192a8;

  margin:
    20px
    0
    5px;

  min-height: 34px;

  padding:
    8px
    20px;

  border-radius: 18px;

  display: inline-block;

  background:
    rgba(255, 255, 255, 0.035);

  border:
    1px solid
    rgba(255, 255, 255, 0.05);

  text-shadow:
    0 0 8px
    rgba(80, 140, 220, 0.3);

}


#cache.cacheok {

  color: #83e0aa;

  background:
    rgba(70, 200, 130, 0.08);

  border-color:
    rgba(80, 220, 150, 0.18);

  text-shadow:

    0 0 8px
    rgba(80, 220, 150, 0.55),

    0 0 18px
    rgba(50, 180, 120, 0.35);

}


/* =====================================================
   STATUS COLORS
   ===================================================== */

.ok {

  color: #7fd0a0;

}

.bad {

  color: #f28b82;

}

.warn {

  color: #fdd663;

}


/* =====================================================
   LOADING DOTS
   ===================================================== */

.loading {

  margin-top: 22px;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 9px;
}


.loader-dot {

  display: inline-block;

  width: 12px;

  height: 12px;

  border-radius: 50%;

  background: #4d8fff;

  box-shadow:

    0 0 8px
    rgba(70, 150, 255, 0.8),

    0 0 18px
    rgba(50, 120, 255, 0.45);

  animation:
    dot-bounce
    1.2s
    infinite
    ease-in-out
    both;
}


.loader-dot:nth-child(1) {

  animation-delay: -0.32s;

}


.loader-dot:nth-child(2) {

  animation-delay: -0.16s;

}


.loader-dot:nth-child(3) {

  animation-delay: 0s;

}


@keyframes dot-bounce {

  0%,
  80%,
  100% {

    transform: scale(0.55);

    opacity: 0.35;

  }

  40% {

    transform: scale(1.15);

    opacity: 1;

  }

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer-brand {

  position: fixed;

  bottom: 16px;

  right: 24px;

  z-index: 2;

  font-size: 13px;

  color:
    rgba(150, 190, 255, 0.42);

  letter-spacing: 0.8px;

  font-weight: 500;

  text-transform: uppercase;

  text-shadow:

    0 0 10px
    rgba(70, 130, 255, 0.35);

}


/* =====================================================

   ===================================================== */

@media (max-width: 600px) {

  #container {

    padding:
      26px
      18px
      32px;

    border-radius: 30px;

  }


  #main-header {

    margin-bottom: 24px;

    padding-bottom: 18px;

  }


  #main-header h1 {

    font-size: 38px;

  }


  #main-header .sub {

    font-size: 16px;

  }


  .card {

    padding:
      24px
      15px
      24px;

    border-radius: 26px;

  }


  #state {

    font-size: 24px;

    min-height: 64px;

    padding:
      12px
      14px;

  }


  #det {

    font-size: 17px;

    padding:
      14px
      12px;

  }


  #det .chip {

    font-size: 17px;

    padding:
      4px
      13px;

  }


  #cache {

  }

}


/* =====================================================
   PULSE
   ===================================================== */

@keyframes pulse-glow {

  0% {
    opacity: 0.65;
  }

  }

    opacity: 0.65;
  }

}


.pulse {

  animation:
    pulse-glow
    2.4s
    ease-in-out
    infinite;

}

</style>

<body>


<div id="container">


  <!-- HEADER -->

  <div id="main-header">

    <h1>منذر سونيي</h1>

    <div class="sub">

      <span> </span>

      &bull;

      لصيانة الأجهزة الإلكترونية

    </div>

  </div>


  <!-- MAIN CARD -->

  <div class="card">


    <div id="state">

      جارٍ كشف النسخة...

    </div>


    <div id="det"></div>


    <div id="cache"></div>


    <!-- Loading -->

    <div class="loading">

      <span class="loader-dot"></span>

      <span class="loader-dot"></span>

      <span class="loader-dot"></span>

    </div>


  </div>


</div>


<!-- FOOTER -->

<div class="footer-brand">
  PS4 AI TOOL
</div>


<script>

(function () {


    var stateEl =
        document.getElementById("state");


    var detEl =
        document.getElementById("det");


    var cacheEl =
        document.getElementById("cache");


    function setState(t, c) {

        stateEl.innerHTML = t;

        stateEl.className = c || "";

    }


    function setCache(t, ok) {

        cacheEl.textContent = t;

        cacheEl.className =
            ok ? "cacheok" : "";

    }


    var params =
        new URLSearchParams(location.search);


    var key = null,
        fwnum = null;


    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);


    if (m) {

        var minor =
            parseInt(m[2], 16);

        var ms =
            minor.toString(16);


        if (ms.length < 2)
            ms = "0" + ms;


        key =
            m[1] + "." + ms;


        fwnum =
            parseInt(m[1], 10) * 100
            +
            parseInt(ms, 10);

    }


    var bug = null,
        why = "";


    var forced =
        params.get("bug");


    if (
        forced === "lapse" ||
        forced === "poops"
    ) {

        bug = forced;

        why =
            "تم التحديد يدوياً ?bug="
            +
            forced;

    }

    else if (!key) {

        why =
            "هذا المتصفح ليس بلايستيشن 4";

    }

    else if (fwnum <= 1202) {

        bug = "lapse";

        why =
            key +
            " — متوافق (Lapse)";

    }

    else if (fwnum >= 1250) {

        bug = "poops";

        why =
            key +
            " — متوافق (Poops)";

    }

    else {

        why =
            key +
            " — غير مدعوم";

    }


    /*
     * عرض معلومات النظام
     */

    var fwDisplay =
        key
        ?
        "<b>" + key + "</b>"
        :
        "<span style='color:#8f9eb0;'>غير معروف</span>";


    var bugDisplay =
        bug
        ?
        "<span class='chip'>"
        +
        bug.toUpperCase()
        +
        "</span>"
        :
        "<span style='color:#8f9eb0;'>لا يوجد</span>";


    detEl.innerHTML =

        "النظام "

        +
        fwDisplay

        +
        " &nbsp;•&nbsp; "

        +
        "الثغرة "

        +
        bugDisplay

        +
        " &nbsp;•&nbsp; "

        +
        why;


    /*
     * إذا لم تكن النسخة مدعومة
     */

    if (!bug) {

        setState(
            "نسخة غير مدعومة",
            "bad"
        );

        return;

    }


    /*
     * تحديد الصفحة المطلوبة
     */

    var target =

        (
            bug === "lapse"
            ?
            "run_lapse.html"
            :
            "PS4_13.00_Webkit.html"
        )
        +
        location.search;


    function go() {

        setState(
            "جارٍ تحميل "
            +
            bug
            +
            " ...",
            "warn"
        );


        location.replace(target);

    }


    /*
     * انتظار الضغط
     */

    function waitForTap(msg, action) {

        setState(
            msg,
            "warn"
        );


        function fire() {

            window.removeEventListener(
                "click",
                fire
            );


            window.removeEventListener(
                "keydown",
                fire
            );


            action();

        }


        window.addEventListener(
            "click",
            fire
        );


        window.addEventListener(
            "keydown",
            fire
        );

    }


    /*
     * Application Cache
     */

    var ac =
        window.applicationCache;


    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    }

    else if (!navigator.onLine) {

        setCache(
            "غير متصل — التشغيل من التخزين المؤقت",
            true
        );

        go();

    }

    else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "التخزين المؤقت جاهز",
            true
        );

        go();

    }

    else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {
            ac.swapCache();
        }
        catch (e) {}


        setCache(
            "تم تحميل التحديث",
            true
        );


        waitForTap(
            "تحديث جاهز — اضغط للتحديث والتشغيل",
            function () {

                location.reload();

            }
        );

    }

    else {


        setCache(
            "جارٍ التحقق من التخزين المؤقت..."
        );


        ac.addEventListener(
            "downloading",
            function () {

                setCache(
                    "التخزين المؤقت للمرة الأولى..."
                );

            },
            false
        );


        ac.addEventListener(
            "progress",
            function (e) {

                if (
                    e &&
                    e.total
                ) {

                    setCache(
                        "تخزين "
                        +
                        Math.round(
                            (e.loaded / e.total) * 100
                        )
                        +
                        "%"
                    );

                }

            },
            false
        );


        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "تم التخزين المؤقت — جاهز للاستخدام دون اتصال",
                    true
                );


                waitForTap(
                    "جاهز — اضغط للتشغيل",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                }
                catch (e) {}


                setCache(
                    "التحديث جاهز",
                    true
                );


                waitForTap(
                    "تحديث جاهز — اضغط لإعادة التحميل",
                    function () {

                        location.reload();

                    }
                );

            },
            false
        );


        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "التخزين المؤقت جاهز",
                    true
                );


                go();

            },
            false
        );


        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "فشل التخزين المؤقت"
                );


                waitForTap(
                    "فشل التخزين — اضغط للتشغيل رغم ذلك",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "التخزين المؤقت قديم"
                );


                waitForTap(
                    "التخزين قديم — اضغط للتشغيل",
                    go
                );

            },
            false
        );

    }


})();

</script>

</body>
