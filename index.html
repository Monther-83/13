<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منذر سونيي لصيانة الأجهزة الإلكترونية بصرة عشار شارع الكويت 009647700672595</title>
<link rel="stylesheet" href="../style.css">
<style>
    body {
        background: #1a1a1a;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }
    .logo-container {
        text-align: center;
        margin: 20px auto;
        max-width: 600px;
    }
    .logo-container img {
        max-width: 100%;
        height: auto;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 150, 255, 0.5);
        border: 3px solid #0096ff;
    }
    h1 {
        font-size: 28px;
        color: #00d4ff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
        padding: 0 15px;
        line-height: 1.5;
    }
    hr {
        border: none;
        height: 2px;
        background: linear-gradient(to right, transparent, #0096ff, transparent);
        margin: 20px auto;
        max-width: 80%;
    }
    #msgs {
        font-size: 26px;
        margin: 40px auto 100px;
        text-align: center;
        padding: 0 20px;
        line-height: 1.8;
        color: #ffcc00;
        max-width: 900px;
    }
    #loader {
        text-align: center;
        margin: 30px auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #loader span {
        width: 60px;
        height: 60px;
        border: 6px solid #333;
        border-top: 6px solid #00d4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: inline-block;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .error-box {
        background: #4a0000;
        border: 2px solid #ff0000;
        padding: 15px;
        border-radius: 10px;
        margin: 20px auto;
        max-width: 800px;
    }
    .info-box {
        background: #002a4a;
        border: 2px solid #0096ff;
        padding: 15px;
        border-radius: 10px;
        margin: 20px auto;
        max-width: 800px;
        font-size: 20px;
    }
</style>
</head>
<body>

<!-- ✅ الصورة في الأعلى -->
<div class="logo-container">
    <img src="img.jpg" alt="منذر سونيي لصيانة الأجهزة الإلكترونية"
         onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22><rect width=%22400%22 height=%22200%22 fill=%22%23003366%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22white%22 font-size=%2224%22 text-anchor=%22middle%22 dy=%22.3em%22>منذر سونيي</text></svg>';">
</div>

<h1>هذا المتصفح يدعم جميع إصدارات بلايستيشن 4 من نظام 5.05 إلى نظام 13.52</h1>
<hr>

<div id="loader" aria-label="جارٍ التحميل"><span></span></div>

<h1 id="msgs">جارٍ تحميل GoldHEN v2.4b18.12 ... يرجى الانتظار</h1>

<script>
(function () {
    "use strict";

    var msgs = document.getElementById("msgs");
    var loader = document.getElementById("loader");

    function setMessage(html) {
        if (msgs) msgs.innerHTML = html;
        if (loader) loader.style.display = "none";
    }

    function onScriptError() {
        setMessage('<div class="error-box">⚠️ تعذر العثور على المحتوى!<br>امسح بيانات المتصفح وأعد تثبيت الملفات ...</div>');
    }

    // ===== كشف إصدار PS4 =====
    var uaFull = navigator.userAgent || "";
    var match = uaFull.match(/PlayStation 4[ \/]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Unknown";
    var fwNum = isPS4 ? parseFloat(fwVersion) : NaN;

    console.log("========================================");
    console.log("[HOST] User Agent:", uaFull);
    console.log("[HOST] Is PS4:", isPS4);
    console.log("[HOST] FW Version:", fwVersion);
    console.log("[HOST] URL:", window.location.href);
    console.log("========================================");

    // ===== تسجيل Service Worker (للتخزين على GitHub) =====
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js")
            .then(function (reg) {
                console.log("[SW] ✅ Registered:", reg.scope);
            })
            .catch(function (err) {
                console.warn("[SW] ⚠️ Failed:", err);
            });
    } else {
        console.log("[SW] ❌ Not supported");
    }

    // ===== فحص AppCache (للمتصفحات القديمة فقط) =====
    var appCacheStatus = -1;
    try {
        if (window.applicationCache) {
            appCacheStatus = window.applicationCache.status;
            console.log("[AppCache] Status:", appCacheStatus);
        }
    } catch (e) {
        console.warn("[AppCache] Error:", e);
    }

    // ===== إذا لم يكن PS4 =====
    if (!isPS4) {
        setMessage('<div class="info-box">ℹ️ هذا الهوست مخصص لجهاز PS4 بإصدارات 5.05 و 7.00 إلى 13.52</div>');
        return;
    }

    // ===== إذا تعذر قراءة الإصدار =====
    if (isNaN(fwNum)) {
        setMessage('<div class="error-box">تعذر تحديد إصدار النظام: <span style="color: red;">' + fwVersion + '</span></div>');
        return;
    }

    // ===== دالة تحميل السكربت =====
    function loadScript(src, opts) {
        opts = opts || {};
        var script = document.createElement("script");
        if (opts.module) script.type = "module";
        script.src = src;
        script.onerror = function () {
            console.error("[HOST] ❌ Failed to load:", src);
            onScriptError();
        };
        script.onload = function () {
            console.log("[HOST] ✅ Loaded:", src);
            if (opts.onload) opts.onload();
        };
        document.head.appendChild(script);
        console.log("[HOST] 📥 Loading:", src);
    }

    // ===== تشغيل الإكسبلويت مباشرة (بدون إعادة توجيه) =====
    // هذا هو الإصلاح الأساسي: لا نعيد التوجيه حتى لو كان AppCache فارغًا
    if (fwNum === 5.05 || fwNum === 5.07) {
        loadScript("505/exploit.js");
    }
    else if (fwNum >= 7.00 && fwNum <= 8.52) {
        loadScript("700/alert.js", { module: true });
    }
    else if (fwNum >= 9.00 && fwNum <= 9.60) {
        loadScript("900/alert.js", { module: true });
    }
    else if (fwNum >= 10.00 && fwNum <= 11.02) {
        loadScript("css/main.js", {
            onload: function () {
                setTimeout(function () {
                    if (typeof window.doJb === "function") {
                        window.doJb();
                    } else {
                        setMessage('<div class="error-box">⚠️ دالة doJb غير موجودة في css/main.js</div>');
                    }
                }, 500);
            }
        });
    }
    else if (fwNum >= 11.50 && fwNum <= 12.02) {
        loadScript("slopkit/chain_lapse.js", { module: true });
    }
    else if (fwNum >= 12.50 && fwNum <= 13.00) {
        loadScript("slopkit/chain_poops.js", { module: true });
    }
    else if (fwNum >= 13.02 && fwNum <= 13.52) {
        loadScript("slopkit/jb.js?v=10", { module: true });
    }
    else {
        setMessage('<div class="error-box">إصدار النظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span></div>');
    }
})();
</script>

</body>
</html>
