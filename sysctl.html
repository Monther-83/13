<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 sysctl / psid</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 4px; }
  .sub { color:#61708a; font-size:13px; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 118px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading...</div>
  <p class="sub"><b>DRY.</b> WebKit primitive and syscalls only &mdash; no aio,
     no netcontrol, no double free, nothing armed. It reads sysctls and puts
     <code>Math.expm1</code> back. Safe to run as often as you like; no reboot.</p>
  <div id="out"></div>
</div>
<script type="module">import "./sysctl.js";</script>
</body>
</html>
